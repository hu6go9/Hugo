<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Compos — Ligue 1</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img class="brand-logo" src="assets/logos/competitions/ligue1-mcdonalds.png" alt="Ligue 1 McDonald's" />
    <span>
      Compos
      <small>Prototype — données fictives</small>
    </span>
  </div>
  <div class="save-indicator" id="save-indicator"><span class="dot"></span> Sauvegarde locale auto</div>
</header>

<main>

  <section id="view-compo">
    <!-- --- Étape 1 : choix du club --- -->
    <div class="landing" id="club-picker">
      <div class="landing-header">
        <h2>Choisis ton club</h2>
        <p>Compose ensuite le onze type, poste par poste.</p>
      </div>
      <div class="club-picker-grid" id="club-picker-grid"></div>
    </div>

    <!-- --- Étape 2 : effectif + terrain --- -->
    <div class="compo-layout" id="compo-layout" style="display:none;">
      <div class="panel">
        <div class="panel-head-row">
          <div class="active-club-header" id="roster-club-header"></div>
          <button class="btn btn-ghost" id="change-club-btn" type="button">Changer de club</button>
        </div>
        <div class="roster-cat-label" style="margin-top:0;">Effectif</div>
        <div class="roster-list" id="roster-list"></div>
      </div>

      <div class="pitch-wrap" id="pitch-wrap">
        <div class="formation-bar">
          <div class="active-club-header" id="pitch-club-header"></div>
          <select id="formation-select"></select>
          <div class="spacer"></div>
          <button class="btn btn-ghost" id="compo-reset">Réinitialiser</button>
          <button class="btn btn-primary" id="compo-share">Partager</button>
        </div>
        <div class="pitch" id="pitch">
          <div class="center-circle"></div>
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="credit">Prototype LFP Media — données joueurs fictives, à remplacer par la source officielle.</footer>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
